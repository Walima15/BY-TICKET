[workspace]
resolver = "2"
members = [
  "event_ticket",
  "rewards",
  "attendance_badge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.91"
publish = false

[workspace.dependencies]
soroban-sdk = "28.0.0"

# Release profile tuned for small, deterministic Soroban WASM.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# `stellar contract build` uses this profile when logs are wanted on testnet.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
