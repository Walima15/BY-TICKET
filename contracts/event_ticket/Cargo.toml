[package]
name = "event_ticket"
description = "BY Tickets: event creation, ticket minting, controlled transfers and check-in"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Integration tests run the real rewards + badge contracts natively.
rewards = { path = "../rewards" }
attendance_badge = { path = "../attendance_badge" }
