# Netlify Next.js runtime for apps/web.
# Leave the publish directory empty. Netlify's Next.js adapter publishes the
# server build. This app is not a static export, so Cloudflare Pages is not
# configured. Secrets are set in the Netlify UI, not in this file. See SETUP.md.
[build]
  base = "apps/web"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_STELLAR_NETWORK = "testnet"
  NEXT_PUBLIC_STELLAR_RPC_URL = "https://soroban-testnet.stellar.org"
  NEXT_PUBLIC_STELLAR_HORIZON_URL = "https://horizon-testnet.stellar.org"
  NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"
  NEXT_PUBLIC_USDC_ASSET_CODE = "USDC"
  NEXT_PUBLIC_QR_ROTATION_SECONDS = "20"
  NEXT_PUBLIC_ZMW_PER_USDC = "26.5"
  PAYMENT_RAMP_PROVIDER = "stub"
  PLATFORM_FEE_BPS = "250"
